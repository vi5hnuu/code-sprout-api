spring.application.name=codesprout
spring.output.ansi.enabled=always
server.port=9093
server.address=0.0.0.0
logging.level.web=DEBUG
logging.level.org.springframework.data.mongodb.core=DEBUG
logging.level.org.springframework.data.mongodb.core.mapping=DEBUG
spring.jpa.open-in-view=false

#SQL
spring.jpa.hibernate.ddl-auto=none
spring.datasource.url=${DB_HOST:jdbc:mysql://localhost:3306/code_sprout}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#jakson
spring.jackson.mapper.ACCEPT_CASE_INSENSITIVE_ENUMS =true

#
server.connection-timeout=10s  # Timeout for server connections
spring.servlet.multipart.file-size-threshold=1MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.max-file-size=10MB

#s3
aws.s3.primary.accessKey= ${AWS_ACCESS_KEY_PRIMARY}
aws.s3.primary.secretKey= ${AWS_SECRET_KEY_PRIMARY}
aws.s3.primary.region= ${AWS_REGION_PRIMARY}
aws.s3.primary.bucketName= ${AWS_BUCKET_PRIMARY}

aws.s3.secondary.accessKey= ${AWS_ACCESS_KEY_SECONDARY}
aws.s3.secondary.secretKey= ${AWS_SECRET_KEY_SECONDARY}
aws.s3.secondary.region= ${AWS_REGION_SECONDARY}
aws.s3.secondary.bucketName= ${AWS_BUCKET_SECONDARY}

cloud.aws.stack.auto=false

#jwt
app.jwt-secret=${JWT_SECRET:xyz}

#jwt expiration -> 24hr
app.jwt-expiration-milliseconds=86400000

#mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${PRIMARY_EMAIL:xyz@gmail.com}
spring.mail.password=${PRIMARY_EMAIL_PASSWORD:xyz}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#google
google.clientIds=${CLIENT_IDS}
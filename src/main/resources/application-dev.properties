spring.application.name=codesprout
spring.output.ansi.enabled=always
server.port=9093
server.address=0.0.0.0
logging.config=classpath:log4j2-dev.yaml
spring.jpa.open-in-view=false

#SQL
spring.jpa.hibernate.ddl-auto=none
spring.datasource.url=${DB_HOST:jdbc:mysql://localhost:3306/code_sprout}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#jakson
spring.jackson.mapper.ACCEPT_CASE_INSENSITIVE_ENUMS =true

#
server.connection-timeout=10s

# Async MVC timeout: must exceed judge responseTimeout (35s). 503 returned if exceeded.
spring.mvc.async.request-timeout=40000
spring.servlet.multipart.file-size-threshold=1MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.max-file-size=10MB

#s3
aws.s3.primary.accessKey= ${AWS_ACCESS_KEY_PRIMARY}
aws.s3.primary.secretKey= ${AWS_SECRET_KEY_PRIMARY}
aws.s3.primary.region= ${AWS_REGION_PRIMARY}
aws.s3.primary.bucketName= ${AWS_BUCKET_PRIMARY}

aws.s3.secondary.accessKey= ${AWS_ACCESS_KEY_SECONDARY}
aws.s3.secondary.secretKey= ${AWS_SECRET_KEY_SECONDARY}
aws.s3.secondary.region= ${AWS_REGION_SECONDARY}
aws.s3.secondary.bucketName= ${AWS_BUCKET_SECONDARY}

AWS_S3_BASE_URL=${AWS_S3_BASE_URL}
cloud.aws.stack.auto=false

#jwt
app.jwt-secret=${JWT_SECRET:xyz}

#jwt expiration -> 24hr
app.jwt-expiration-milliseconds=86400000

#mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${PRIMARY_EMAIL:xyz@gmail.com}
spring.mail.password=${PRIMARY_EMAIL_PASSWORD:xyz}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# === Google OAuth2 Client === [since we are not using server flow except client-id none is required]
spring.security.oauth2.client.registration.google.client-id=758198304615-4re80040l1ksvkoli8n4p3iv4ffeqc3b.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.token-revoke=https://oauth2.googleapis.com/revoke

#redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

#judge service
judge.url=${JUDGE_URL:http://localhost:8080}
judge.api-key=${JUDGE_API_KEY}
judge.stream-secret=${JUDGE_STREAM_SECRET}
# Max concurrent requests to the judge. Tune per judge capacity.
judge.connection-pool-size=${JUDGE_POOL_SIZE:200}

#resilience4j – circuit breaker for judge calls
resilience4j.circuitbreaker.instances.judge.slidingWindowSize=20
resilience4j.circuitbreaker.instances.judge.failureRateThreshold=50
resilience4j.circuitbreaker.instances.judge.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.judge.permittedNumberOfCallsInHalfOpenState=5
resilience4j.circuitbreaker.instances.judge.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.retry.instances.judge.maxAttempts=2
resilience4j.retry.instances.judge.waitDuration=200ms